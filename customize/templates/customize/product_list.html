<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products List</title>
</head>
<body>
    <h1>{{ title }}</h1>

    <p>Total: {{ total_products }}</p>

    <ul>
        {% for product in products %}
            <li>
                {{ product.name }} — {{ product.price }} ₴
            </li>
        {% endfor %}
    </ul>
</body>
</html>
